name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
          
      - name: Restore dependencies
        run: dotnet restore
        
      - name: Build
        run: dotnet build --configuration Release --no-restore
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/bin/Release/
            **/obj/
          retention-days: 1

  test:
    name: Test and analyze
    runs-on: windows-latest
    needs: build  # Só executa se o job 'build' for bem-sucedido
    if: success()  # Garante que só executa em caso de sucesso do job anterior
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
          
      - name: Install Sonar scanner
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-sonarscanner
          
      - name: Install Coverlet
        run: |
          dotnet add DotnetSample.Testes/DotnetSample.Testes.csproj package coverlet.collector
          dotnet add DotnetSample.Testes/DotnetSample.Testes.csproj package coverlet.msbuild
          
      - name: SonarQube Begin
        run: |
          dotnet sonarscanner begin `
            /k:"rodcferraz_dotnetsample" `
            /o:"rodcferraz" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
            
      - name: Run tests with coverage
        run: |
          dotnet test DotnetSample.Testes/DotnetSample.Testes.csproj `
            -c Release `
            /p:CollectCoverage=true `
            /p:CoverletOutputFormat=opencover `
            /p:CoverletOutput=./TestResults/coverage.opencover.xml `
            /p:Exclude="[xunit.*]*"
            
      - name: SonarQube End
        run: dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
